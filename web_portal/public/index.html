<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NERMAI IAS" />
    <title>NERMAI IAS Academy</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <!-- Expo Metro Web Style Reset -->
    <style id="expo-reset">
      html, body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Remove browser focus rings & ugly Chrome autofill backgrounds */
      input, textarea {
        outline: none !important;
      }
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
        -webkit-text-fill-color: #212121 !important;
        transition: background-color 5000s ease-in-out 0s;
      }
      /* Laptop/Desktop Login Background Top Anchor Fix */
      @media (min-width: 769px) {
        #login-laptop-bg,
        #login-laptop-bg > div,
        div[style*="login_bg_laptop"] {
          background-position: center top !important;
        }
      }
      /* Strict Whole-Word Text Wrapping & Hyphenation Prevention */
      *, *::before, *::after {
        word-break: normal !important;
        overflow-wrap: break-word !important;
        word-wrap: break-word !important;
        -webkit-hyphens: none !important;
        -moz-hyphens: none !important;
        -ms-hyphens: none !important;
        hyphens: none !important;
      }
      div[dir="auto"], span[dir="auto"], [class*="r-wordWrap"], [class*="r-"], p, span, div {
        word-break: normal !important;
        overflow-wrap: break-word !important;
        word-wrap: break-word !important;
        -webkit-hyphens: none !important;
        hyphens: none !important;
        text-wrap: pretty !important;
      }
    </style>
    <script>
      (function() {
        try {
          var savedDelta = localStorage.getItem("site_font_size_delta");
          if (savedDelta && !isNaN(Number(savedDelta))) {
            var delta = Number(savedDelta);
            if (delta !== 0) {
              var css = "";
              for (var s = 8; s <= 50; s++) {
                var target = s + delta;
                css += '[style*="font-size: ' + s + 'px"], [style*="font-size:' + s + 'px"] { font-size: ' + target + 'px !important; }\n';
              }
              var styleEl = document.createElement("style");
              styleEl.id = "nermai-font-override-sheet";
              styleEl.innerHTML = css;
              document.head.appendChild(styleEl);
            }
          }
        } catch(e) {}
      })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Mobile Phone Cache Purge & Fresh Asset Enforcer (Phone View Only) -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || "";
          var isPhone = /Android|iPhone|iPad|iPod/i.test(ua) || (window.innerWidth <= 768);
          // Strictly apply ONLY to phone view website. Do NOT touch laptop or desktop browsers!
          if (!isPhone) return;

          fetch("/version.json?_t=" + Date.now(), { cache: "no-store" })
            .then(function(res) {
              if (!res.ok) return null;
              return res.json();
            })
            .then(function(data) {
              if (data && data.version) {
                var storedBuild = localStorage.getItem("nermai_mobile_build_id");
                if (storedBuild && storedBuild !== String(data.version)) {
                  localStorage.setItem("nermai_mobile_build_id", String(data.version));
                  if (typeof window !== "undefined" && "caches" in window) {
                    caches.keys().then(function(names) {
                      for (var i = 0; i < names.length; i++) {
                        caches.delete(names[i]);
                      }
                    });
                  }
                  window.location.reload(true);
                } else if (!storedBuild) {
                  localStorage.setItem("nermai_mobile_build_id", String(data.version));
                }
              }
            })
            .catch(function(_) {});
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
